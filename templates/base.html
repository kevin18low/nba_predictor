<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Predictor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body data-game-id="{{ game_id }}">

<nav class="navbar">
    <a href="{{ url_for('index') }}" class="nav-brand">NBA Predictor</a>
    <div class="nav-games">
        {% for game in games %}
        <a href="{{ url_for('scoreboard', game_id=game.game_id) }}" class="nav-game
            {% if game.game_id == game_id %}active{% endif %}">
            <img src="https://a.espncdn.com/i/teamlogos/nba/500/{{ game.away_team | espn_logo }}.png"
                 alt="{{ game.away_team }}" class="nav-logo">
            <span class="nav-vs">@</span>
            <img src="https://a.espncdn.com/i/teamlogos/nba/500/{{ game.home_team | espn_logo }}.png"
                 alt="{{ game.home_team }}" class="nav-logo">
        </a>
        {% endfor %}
    </div>
</nav>

{% block content %}{% endblock %}

</body>
</html>
